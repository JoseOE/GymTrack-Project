# Publica PaginaWeb/src/main/resources/static como sitio de GitHub Pages
name: Deploy PaginaWeb to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/modest-shannon-fx5cjy
    paths:
      - "PaginaWeb/src/main/resources/static/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: PaginaWeb/src/main/resources/static

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
