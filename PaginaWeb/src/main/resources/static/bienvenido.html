<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido | GymTrack</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2964/2964514.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3 d-flex align-items-center gap-2" href="index.html">
                <i class='bx bx-dumbbell text-primary fs-2'></i>
                <span>Gym<span class="text-primary">Track</span></span>
            </a>
            <div class="ms-auto d-flex align-items-center gap-3">
                <span class="text-white-50" id="nav-user-name"></span>
                <a href="login.html" class="btn btn-outline-danger btn-sm rounded-pill px-3" onclick="localStorage.removeItem('userName')">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <div class="container flex-grow-1 d-flex flex-column justify-content-center align-items-center text-center py-5">
        <div class="bg-white p-5 rounded-4 shadow-sm page-fade-in" style="max-width: 600px; width: 100%;">
            <div class="bg-success bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center mx-auto mb-4" style="width:100px;height:100px">
                <i class='bx bx-check text-success display-3'></i>
            </div>
            <h1 class="display-5 fw-bold mb-3">¡Bienvenido!</h1>
            <h3 class="text-primary fw-semibold mb-4" id="welcome-message">Cargando...</h3>
            <p class="text-body-secondary fs-5 mb-5">Has iniciado sesión correctamente. Pronto habilitaremos el panel de control completo aquí.</p>
            
            <a href="index.html" class="btn btn-primary btn-lg rounded-pill px-5 shadow-sm">
                Ir al Inicio
            </a>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const userName = localStorage.getItem('userName');
            // Protección de ruta: si no hay sesión, regresa al login
            if (!userName) {
                window.location.href = 'login.html';
                return;
            }
            document.getElementById('welcome-message').textContent = userName;
            document.getElementById('nav-user-name').innerHTML = `<i class='bx bx-user-circle'></i> ${userName}`;
        });
    </script>
</body>
</html>
