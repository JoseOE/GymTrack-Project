<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | GymTrack</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2964/2964514.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css/styles.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() { emailjs.init({ publicKey: "91tnidFbgPPknlkBX" }); })();
    </script>
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3 d-flex align-items-center gap-2" href="index.html">
                <i class='bx bx-dumbbell text-primary fs-2'></i>
                <span>Gym<span class="text-primary">Track</span></span>
            </a>
            <div class="ms-auto">
                <a href="index.html" class="btn btn-outline-light rounded-pill px-4 d-flex align-items-center gap-2"><i class='bx bx-home-alt'></i> <span class="d-none d-sm-inline">Volver al Inicio</span></a>
            </div>
        </div>
    </nav>

    <section class="flex-grow-1 d-flex align-items-center py-5">
        <div class="container">
            <div class="row justify-content-center align-items-center g-5">
                
                <!-- Información de contacto -->
                <div class="col-lg-5 text-center text-lg-start mb-4 mb-lg-0">
                    <span class="badge rounded-pill bg-primary bg-opacity-10 text-primary px-3 py-2 mb-3 fs-6">
                        <i class='bx bx-chat'></i> Hablemos
                    </span>
                    <h2 class="display-5 fw-bold mb-4 lh-sm">¿Tienes dudas?<br><span class="text-primary">Estamos aquí para ti.</span></h2>
                    <p class="text-body-secondary fs-5 mb-5">Llena el formulario y un asesor se pondrá en contacto contigo a la brevedad para darte una demostración de GymTrack.</p>
                    
                    <div class="d-flex flex-column gap-4 align-items-center align-items-lg-start">
                        <div class="d-flex align-items-center gap-3">
                            <div class="bg-success bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center flex-shrink-0" style="width:50px;height:50px">
                                <i class='bx bxl-whatsapp text-success fs-3'></i>
                            </div>
                            <div class="text-start">
                                <h6 class="fw-bold mb-0">WhatsApp Directo</h6>
                                <a href="https://wa.me/527721013839" target="_blank" class="text-body-secondary text-decoration-none hover-primary transition">+52 772 101 3839</a>
                            </div>
                        </div>
                        <div class="d-flex align-items-center gap-3">
                            <div class="bg-primary bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center flex-shrink-0" style="width:50px;height:50px">
                                <i class='bx bx-envelope text-primary fs-3'></i>
                            </div>
                            <div class="text-start">
                                <h6 class="fw-bold mb-0">Correo Electrónico</h6>
                                <a href="mailto:josemariaortizescamilla@gmail.com" class="text-body-secondary text-decoration-none hover-primary transition">josemariaortizescamilla@gmail.com</a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Formulario -->
                <div class="col-lg-6 offset-lg-1">
                    <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
                        <div class="text-center mb-4 d-lg-none">
                            <h3 class="fw-bold">Contáctanos</h3>
                        </div>

                        <form id="contact-form">
                            <div class="mb-3">
                                <label for="user_name" class="form-label fw-semibold small">Nombre Completo</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-body-tertiary border-end-0"><i class='bx bx-user text-body-secondary'></i></span>
                                    <input type="text" class="form-control form-control-lg rounded-end-3 border-start-0" id="user_name" name="user_name" placeholder="Ej. Juan Pérez" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="user_email" class="form-label fw-semibold small">Correo Electrónico</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-body-tertiary border-end-0"><i class='bx bx-envelope text-body-secondary'></i></span>
                                    <input type="email" class="form-control form-control-lg rounded-end-3 border-start-0" id="user_email" name="user_email" placeholder="ejemplo@correo.com" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="message" class="form-label fw-semibold small">Mensaje</label>
                                <textarea class="form-control rounded-3 bg-body-tertiary border-0 px-4 py-3" id="message" name="message" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>
                            </div>
                            
                            <div id="alert-success" class="alert alert-success d-none small py-2" role="alert"></div>
                            <div id="alert-error" class="alert alert-danger d-none small py-2" role="alert"></div>

                            <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-bold shadow-sm" id="btn-submit">
                                Enviar Mensaje <i class='bx bx-send ms-1'></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        document.getElementById('contact-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const btn = document.getElementById('btn-submit');
            const alertSuccess = document.getElementById('alert-success');
            const alertError = document.getElementById('alert-error');
            
            btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status"></span> Enviando...';
            btn.disabled = true;
            alertSuccess.classList.add('d-none');
            alertError.classList.add('d-none');

            emailjs.sendForm('service_69aedda', 'template_36v663n', this)
                .then(() => {
                    alertSuccess.innerHTML = '<i class="bx bx-check-circle"></i> Mensaje enviado correctamente. Te contactaremos pronto.';
                    alertSuccess.classList.remove('d-none');
                    btn.innerHTML = 'Enviar Mensaje <i class="bx bx-send ms-1"></i>';
                    btn.disabled = false;
                    this.reset();
                }, (error) => {
                    alertError.innerHTML = '<i class="bx bx-error-circle"></i> Hubo un error al enviar el mensaje. Inténtalo más tarde.';
                    alertError.classList.remove('d-none');
                    btn.innerHTML = 'Enviar Mensaje <i class="bx bx-send ms-1"></i>';
                    btn.disabled = false;
                });
        });
    </script>
</body>
</html>
